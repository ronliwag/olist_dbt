version: 2

models:
  # ------------------------------------------------------------------
  # STG_CUSTOMERS
  # ------------------------------------------------------------------
  - name: stg_customers
    description: "Staging model for customer details."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - customer_unique_id
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - not_null
      - name: customer_zip_code_prefix
        tests:
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null

  # ------------------------------------------------------------------
  # STG_GEOLOCATION
  # ------------------------------------------------------------------
  - name: stg_geolocation
    description: "Staging model for geographic zip code coordinates."
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - not_null
      - name: geolocation_lat
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: geolocation_lng
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
      - name: geolocation_city
        tests:
          - not_null
      - name: geolocation_state
        tests:
          - not_null

  # ------------------------------------------------------------------
  # STG_ORDERS
  # ------------------------------------------------------------------
  - name: stg_orders
    description: "Staging model for order header records."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - not_null
      - name: purchased_at
        tests:
          - not_null

  # ------------------------------------------------------------------
  # STG_ORDER_ITEMS
  # ------------------------------------------------------------------
  - name: stg_order_items
    description: "Staging model for individual line items in orders."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
              config:
                severity: warn
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: shipping_limit_date
        tests:
          - not_null
      - name: price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: freight_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  # ------------------------------------------------------------------
  # STG_ORDER_PAYMENTS
  # ------------------------------------------------------------------
  - name: stg_order_payments
    description: "Staging model for order payment details."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null
      - name: payment_sequential
        tests:
          - not_null

  # ------------------------------------------------------------------
  # STG_ORDER_REVIEWS
  # ------------------------------------------------------------------
  - name: stg_order_reviews
    description: "Staging model for customer reviews."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
              - order_id
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: review_created_at
        tests:
          - not_null
      - name: review_answered_at
        tests:
          - not_null

  # ------------------------------------------------------------------
  # STG_PRODUCTS
  # ------------------------------------------------------------------
  - name: stg_products
    description: "Staging model for product catalog."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_category_name
        tests:
          - relationships:
              arguments:
                to: ref('stg_product_category_translation')
                field: product_category_name
              config:
                severity: warn

  # ------------------------------------------------------------------
  # STG_PRODUCT_CATEGORY_TRANSLATION
  # ------------------------------------------------------------------
  - name: stg_product_category_translation
    description: "Lookup table for Portuguese to English category translations."
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        tests:
          - not_null

  # ------------------------------------------------------------------
  # STG_SELLERS
  # ------------------------------------------------------------------
  - name: stg_sellers
    description: "Staging model for seller registry."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        tests:
          - not_null
      - name: seller_city
        tests:
          - not_null
      - name: seller_state
        tests:
          - not_null