version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: raw_order_items
    columns:
      - name: order_item_id
        tests:
          - not_null
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

  - name: raw_order_payments
    columns:
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: raw_order_reviews
    columns:
      - name: review_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: raw_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: raw_product_category_name_translation
  
  - name: raw_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
  
  - name: raw_geolocation
  
  